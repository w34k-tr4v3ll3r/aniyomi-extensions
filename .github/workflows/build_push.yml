name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_CHUNK_SIZE: 65
      CI_CHUNK_NUM: 0
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build WatchAnimeWorld APK
        run: ./gradlew :src:en:WatchAnimeWorld:assembleRelease -x lintKotlinMain -x lintKotlinTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAnimeWorld-apk
          path: src/en/WatchAnimeWorld/build/outputs/apk/release/*.apk
