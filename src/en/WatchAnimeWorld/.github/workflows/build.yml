name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Build extension
        run: ./gradlew :src:en:WatchAnimeWorld:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: WatchAnimeWorld-apk
          path: src/en/WatchAnimeWorld/build/outputs/apk/release/*.apk
